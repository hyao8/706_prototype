# Publishes a GitHub Release when a version tag (for example v0.1) is pushed.
# The built site is attached, so a release can be opened without Node.js.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Zip the built site
        run: cd dist && zip -r "../orphadata-explorer-${GITHUB_REF_NAME}.zip" .
      # Notes come from docs/releases/<tag>.md when that file exists.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          if [ -f "$notes" ]; then
            set -- --notes-file "$notes"
          else
            set -- --generate-notes
          fi
          gh release create "$GITHUB_REF_NAME" "orphadata-explorer-${GITHUB_REF_NAME}.zip" \
            --title "Prototype ${GITHUB_REF_NAME}" --verify-tag "$@"
