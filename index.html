<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Explore the Orphadata rare-disease knowledge base: medical specialties, genes, clinical signs and prevalence, in linked interactive views." />
    <meta name="theme-color" content="#05122b" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Orphadata Rare-Disease Explorer</title>
    <style>
      /* shown until the data file (about 5 MB) has loaded */
      .boot { display: grid; place-items: center; align-content: center; gap: 14px; min-height: 100vh; margin: 0; font: 14px system-ui, sans-serif; color: #557099; background: #ebf2fd; }
      .boot i { width: 34px; height: 34px; border-radius: 50%; border: 3px solid #d6e3f5; border-top-color: #0f5fd2; animation: boot-spin 0.8s linear infinite; }
      .boot b { color: #0b1a36; font-size: 16px; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="boot"><i></i><b>Orphadata Rare-Disease Explorer</b><span>Loading the dataset…</span></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
